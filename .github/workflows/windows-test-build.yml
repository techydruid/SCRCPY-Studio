name: Windows Test Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/windows-test-build.yml"

jobs:
  build-windows:
    name: Build Windows executable
    runs-on: windows-latest
    env:
      BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify build identity
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne $env:BUILD_SHA) {
            throw "Stale checkout: expected $env:BUILD_SHA but found $actual"
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Verify critical controls exist in source
        shell: pwsh
        run: |
          $app = Get-Content "src/App.tsx" -Raw
          @("Enable recording", "Screenshot", "Media Folder", "DesktopControls") | ForEach-Object {
            if (-not $app.Contains($_)) {
              throw "UI regression: missing '$($_)' in src/App.tsx"
            }
          }
          if (-not $app.Contains("desktopProbe.capabilities?.supported === true")) {
            throw "Desktop Mode regression: launch button is not driven by the shared capability result"
          }
          if ($app.Contains('config?.desktopSupported === true')) {
            throw "Desktop Mode regression: stale config.desktopSupported gate returned"
          }
          $desktop = Get-Content "src/DesktopControls.tsx" -Raw
          @("DISPLAY ENVIRONMENT", "Virtual Display", "Android Desktop Windowing", "Samsung DeX", "Technical diagnostics", "Open Logs") | ForEach-Object {
            if (-not $desktop.Contains($_)) {
              throw "Desktop Mode regression: missing '$($_)' in src/DesktopControls.tsx"
            }
          }

      - name: Build and verify frontend bundle
        shell: pwsh
        run: |
          npm run build
          $bundle = (Get-ChildItem "dist" -Recurse -File | ForEach-Object { Get-Content $_.FullName -Raw }) -join "`n"
          @("Enable recording", "Screenshot", "Media Folder", "Virtual Display", "Android Desktop Windowing", "Samsung DeX", "Technical diagnostics", "Open Logs") | ForEach-Object {
            if (-not $bundle.Contains($_)) {
              throw "Built frontend regression: bundle does not contain '$($_)'"
            }
          }

      - name: Force current frontend into Tauri executable
        shell: pwsh
        run: cargo clean -p scrcpy-studio --manifest-path src-tauri/Cargo.toml

      - name: Build SCRCPY Studio executable
        run: npm run tauri build -- --no-bundle

      - name: Write build identity
        shell: pwsh
        run: |
          "SCRCPY Studio Desktop Capability Diagnostics`nCommit: $env:BUILD_SHA`nBuilt: $(Get-Date -AsUTC -Format o)" | Set-Content "src-tauri/target/release/build-info.txt"

      - name: Upload Windows test executable
        uses: actions/upload-artifact@v4
        with:
          name: SCRCPY-Studio-Windows-v0.1-Desktop-Diagnostics-${{ env.BUILD_SHA }}
          path: |
            src-tauri/target/release/scrcpy-studio.exe
            src-tauri/target/release/build-info.txt
          if-no-files-found: error
          retention-days: 14
