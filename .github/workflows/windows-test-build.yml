name: Windows Test Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/windows-test-build.yml"

jobs:
  build-windows:
    name: Build Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Verify critical controls exist in source
        shell: pwsh
        run: |
          $app = Get-Content "src/App.tsx" -Raw
          @("Enable recording", "Screenshot", "Media Folder", "DesktopControls") | ForEach-Object {
            if (-not $app.Contains($_)) {
              throw "UI regression: missing '$($_)' in src/App.tsx"
            }
          }
          $desktop = Get-Content "src/DesktopControls.tsx" -Raw
          @("SMART DESKTOP", "Verified secondary display", "Flex Display") | ForEach-Object {
            if (-not $desktop.Contains($_)) {
              throw "Desktop Mode regression: missing '$($_)' in src/DesktopControls.tsx"
            }
          }

      - name: Build and verify frontend bundle
        shell: pwsh
        run: |
          npm run build
          $bundle = (Get-ChildItem "dist" -Recurse -File | ForEach-Object { Get-Content $_.FullName -Raw }) -join "`n"
          @("Enable recording", "Screenshot", "Media Folder", "SMART DESKTOP", "Verified secondary display", "Flex Display") | ForEach-Object {
            if (-not $bundle.Contains($_)) {
              throw "Built frontend regression: bundle does not contain '$($_)'"
            }
          }

      - name: Force current frontend into Tauri executable
        shell: pwsh
        run: cargo clean -p scrcpy-studio --manifest-path src-tauri/Cargo.toml

      - name: Build SCRCPY Studio executable
        run: npm run tauri build -- --no-bundle

      - name: Write build identity
        shell: pwsh
        run: |
          "SCRCPY Studio Desktop v2.1`nCommit: $env:GITHUB_SHA`nBuilt: $(Get-Date -AsUTC -Format o)" | Set-Content "src-tauri/target/release/build-info.txt"

      - name: Upload Windows test executable
        uses: actions/upload-artifact@v4
        with:
          name: SCRCPY-Studio-Windows-v0.1-Desktop-v2.1
          path: |
            src-tauri/target/release/scrcpy-studio.exe
            src-tauri/target/release/build-info.txt
          if-no-files-found: error
          retention-days: 14
