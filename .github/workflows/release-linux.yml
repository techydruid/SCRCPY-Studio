name: Linux Packages

on:
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - "README.md"
      - "RELEASE_NOTES.md"
      - ".github/workflows/release-linux.yml"
      - ".github/workflows/release-windows.yml"
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-packages:
    name: Build Linux packages
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    env:
      BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify build identity and release version
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          if [[ "$actual" != "$BUILD_SHA" ]]; then
            echo "Stale checkout: expected $BUILD_SHA but found $actual" >&2
            exit 1
          fi
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match app version v$version" >&2
            exit 1
          fi

      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Frontend checks
        run: |
          npm run check
          npm run build

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build AppImage, Debian, and RPM packages
        run: npm run tauri build -- --bundles appimage,deb,rpm --ci

      - name: Stage and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release

          appimage=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          deb=$(find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)
          rpm_file=$(find src-tauri/target/release/bundle/rpm -maxdepth 1 -type f -name '*.rpm' -print -quit)
          test -n "$appimage" || { echo 'AppImage was not produced' >&2; exit 1; }
          test -n "$deb" || { echo 'Debian package was not produced' >&2; exit 1; }
          test -n "$rpm_file" || { echo 'RPM package was not produced' >&2; exit 1; }

          cp "$appimage" "release/SCRCPY-Studio-$APP_VERSION-Linux-x64.AppImage"
          cp "$deb" "release/SCRCPY-Studio-$APP_VERSION-Linux-x64.deb"
          cp "$rpm_file" "release/SCRCPY-Studio-$APP_VERSION-Linux-x64.rpm"
          chmod +x "release/SCRCPY-Studio-$APP_VERSION-Linux-x64.AppImage"

          dpkg-deb --info "release/SCRCPY-Studio-$APP_VERSION-Linux-x64.deb"
          dpkg-deb --contents "release/SCRCPY-Studio-$APP_VERSION-Linux-x64.deb" | grep -E 'scrcpy-studio|\.desktop'
          dpkg-deb --field "release/SCRCPY-Studio-$APP_VERSION-Linux-x64.deb" Recommends | grep -E 'adb|curl'
          rpm -qip "release/SCRCPY-Studio-$APP_VERSION-Linux-x64.rpm"
          rpm -qlp "release/SCRCPY-Studio-$APP_VERSION-Linux-x64.rpm" | grep -E 'scrcpy-studio|\.desktop'

          "release/SCRCPY-Studio-$APP_VERSION-Linux-x64.AppImage" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          test -f squashfs-root/usr/share/applications/SCRCPY\ Studio.desktop || \
            find squashfs-root/usr/share/applications -maxdepth 1 -type f -name '*.desktop' -print -quit | grep .
          rm -rf squashfs-root

          (
            cd release
            sha256sum SCRCPY-Studio-* > SHA256SUMS-Linux-x64.txt
          )
          file release/*
          ls -lh release

      - name: Upload validated Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SCRCPY-Studio-${{ steps.metadata.outputs.version }}-Linux-x64-${{ env.BUILD_SHA }}
          path: release/*
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish Linux release assets
    if: github.ref_type == 'tag'
    needs: linux-packages
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download validated Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: SCRCPY-Studio-${{ needs.linux-packages.outputs.version }}-Linux-x64-${{ github.sha }}
          path: release

      - name: Publish release and assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release -maxdepth 1 -type f -print | sort)
          if (( ${#assets[@]} < 4 )); then
            echo 'Expected the three Linux packages and their checksum file' >&2
            exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          elif ! gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "SCRCPY Studio $GITHUB_REF_NAME" \
              --notes-file RELEASE_NOTES.md; then
            sleep 10
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          fi
