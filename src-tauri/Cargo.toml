[package]
name = "scrcpy-studio"
version = "0.1.2"
description = "Smart scrcpy frontend for Android mirroring and control"
authors = ["TechyDruid"]
edition = "2021"

[lib]
name = "scrcpy_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
